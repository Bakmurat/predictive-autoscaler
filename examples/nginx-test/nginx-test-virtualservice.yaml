---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nginx-test-vs
  namespace: default
spec:
  hosts:
  - nginx.example.com
  gateways:
  - istio-system/nginx-test-gateway
  http:
  # Default route - nginx service
  - route:
    - destination:
        host: nginx-test.default.svc.cluster.local
        port:
          number: 80
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
