---
# PredictiveAutoscaler CR for nginx-test
# UNIFIED SCALER - Single source of truth for deployment replicas
#
# Combines predictive (ML) and reactive (current metrics) into one decision:
#   desired = max(predicted_baseline, reactive_needed, minReplicas)
#
# - Predicted baseline: LSTM predicts RPM within leadTimeMinutes window
# - Reactive floor: current RPM from VictoriaMetrics (catches under-prediction)
# - Scale-up: immediate
# - Scale-down: stabilized (5 min wait, then gradual reduction)
# - The KEDA ScaledObject next to it (nginx-test-keda-fallback.yaml) is PAUSED: this operator is the sole replica
#   controller. Never run both active (see docs/coexistence.md).
# - The operator reads only targetDeployment.{name,namespace}, min/maxReplicas, metrics.requests and prediction.
#   The CRD also accepts container, metrics.cpu/memory and resources, but this version ignores them, so they are omitted.
#
apiVersion: autoscaling.devkuban.com/v1alpha1
kind: PredictiveAutoscaler
metadata:
  name: nginx-test-autoscaler
  namespace: default
  labels:
    app: nginx-test
    scaler-type: predictive
  annotations:
    description: "LSTM-based predictive scaling for nginx-test"
    keda-fallback: "nginx-test-keda-fallback"
spec:
  # Active: this autoscaler scales its Deployment (Recommend, observe-only, is the default when mode is absent).
  mode: Active
  targetDeployment:
    name: nginx-test
    namespace: default

  minReplicas: 1
  maxReplicas: 40

  metrics:
    # Request rate is the scaling signal: sum(rate(istio_requests_total{reporter="destination",...}[1m])).
    # enabled must be true: with it unset or false the operator cannot forecast and runs reactive-only.
    requests:
      enabled: true
      targetRPS: 300      # capacity of one pod in requests per second (same threshold as the KEDA fallback)

  prediction:
    horizonMinutes: 60          # ML API predicts 1 hour ahead (full context)
    leadTimeMinutes: 20         # Use predictions within 20-min window for scaling
    updateIntervalSeconds: 60   # Reconcile every 60s (reactive needs fast cycles)
