---
# KEDA ScaledObject for nginx-test - a PAUSED fallback, kept ready for a manual hand-over
#
# Only ONE controller may own a Deployment's replica count. An active KEDA ScaledObject creates an HPA that writes
# replicas on every sync, so running it next to the PredictiveAutoscaler (which also writes replicas) makes them fight.
# This object is therefore created PAUSED (annotation below): KEDA keeps it but does not scale the Deployment.
#
# Hand-over to KEDA (e.g. the forecaster is unavailable for a long time):
#   1. delete the PredictiveAutoscaler (or stop the operator) so it no longer writes replicas;
#   2. remove the annotation: kubectl -n default annotate scaledobject nginx-test-keda-fallback autoscaling.keda.sh/paused-
# Hand-back: re-add the annotation (autoscaling.keda.sh/paused="true"), check that KEDA no longer changes replicas,
# then re-create the PredictiveAutoscaler. Never run both active. See docs/coexistence.md and
# https://keda.sh/docs/latest/concepts/scaling-deployments/#pause-autoscaling
#
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: nginx-test-keda-fallback
  namespace: default
  labels:
    app: nginx-test
    scaler-type: reactive-fallback
  annotations:
    autoscaling.keda.sh/paused: "true"
    description: "Paused KEDA fallback for nginx-test (manual hand-over only)"
    predictive-autoscaler-name: "nginx-test-autoscaler"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-test

  # Same bounds as the PredictiveAutoscaler (nginx-test-predictive-autoscaler.yaml: 1..40)
  minReplicaCount: 1
  maxReplicaCount: 40

  # Reactive polling - checks frequently for safety
  pollingInterval: 10        # Check every 10 seconds
  cooldownPeriod: 180        # 3 min cooldown before scale-down

  # Scaling behavior - fast up, slow down
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600  # 10 min stabilization — must be longer than
                                           # operator reconciliation interval (5min) to
                                           # prevent operator-KEDA micro-oscillation
          policies:
          - type: Pods
            value: 1
            periodSeconds: 300   # Remove 1 pod every 5 min (was 3 min)
          - type: Percent
            value: 10
            periodSeconds: 300   # Or 10% every 5 min
          selectPolicy: Min      # Conservative scale-down

        scaleUp:
          stabilizationWindowSeconds: 0   # Immediate scale-up
          policies:
          - type: Percent
            value: 100           # Double capacity
            periodSeconds: 15
          - type: Pods
            value: 4             # Or add 4 pods
            periodSeconds: 15
          selectPolicy: Max      # Aggressive scale-up

  triggers:
  # -----------------------------------------------
  # CPU-based scaling (PRIMARY FALLBACK)
  # Fires if predictive missed and CPU > 70%
  # -----------------------------------------------
  - type: cpu
    metricType: Utilization
    metadata:
      value: "70"

  # -----------------------------------------------
  # Memory-based scaling (SECONDARY FALLBACK)
  # Protects against OOM kills
  # -----------------------------------------------
  - type: memory
    metricType: Utilization
    metadata:
      value: "70"

  # -----------------------------------------------
  # Request rate (requests per second), counted once per request: only the destination sidecar's report
  # (without reporter="destination" Istio's source-side series double-count the traffic)
  # -----------------------------------------------
  - type: prometheus
    metadata:
      serverAddress: http://vmselect-vmst.monitoring.svc.cluster.local:8481/select/0/prometheus
      query: |
        sum(rate(istio_requests_total{reporter="destination",destination_workload="nginx-test",destination_workload_namespace="default"}[1m]))
      threshold: "300"             # Scale if per-pod avg RPS > 300
      activationThreshold: "150"   # KEDA activates the scaler when the query value (total RPS, not per pod) exceeds 150
