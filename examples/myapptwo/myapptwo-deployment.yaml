---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapptwo
  namespace: myapptwo
  labels:
    app: myapptwo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapptwo
  template:
    metadata:
      labels:
        app: myapptwo
      annotations:
        sidecar.istio.io/proxyCPU: "125m"
        sidecar.istio.io/proxyCPULimit: "300m"
        sidecar.istio.io/proxyMemory: "128Mi"
        sidecar.istio.io/proxyMemoryLimit: "256Mi"
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
