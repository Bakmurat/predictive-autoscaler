# Defaults for the predictive-autoscaler chart. values.schema.json validates every key. See docs/helm.md.

images:
  operator:
    repository: ghcr.io/bakmurat/predictive-autoscaler-operator
    tag: ""        # default: the chart's appVersion
    digest: ""     # sha256:... ; preferred over the tag when set
  forecaster:      # the forecasting service; the trainer runs the same image
    repository: ghcr.io/bakmurat/predictive-autoscaler-ml-api
    tag: ""
    digest: ""
  statisticalForecaster:   # the light statistical forecaster (forecaster.engine: statistical): no TensorFlow
    repository: ghcr.io/bakmurat/predictive-autoscaler-forecaster-statistical
    tag: ""
    digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []  # [{name: regcred}]

# The Prometheus-compatible query API (Prometheus, VictoriaMetrics vmselect, Thanos Query, ...): required.
# Example: http://prometheus-server.monitoring.svc.cluster.local:80
prometheus:
  url: ""

operator:
  replicas: 1                # more replicas only add standby leaders (leader election is always on)
  watchNamespaces: []        # empty: every namespace
  rbac:
    # false: a shadow (Recommend-only) install. The operator may only read deployments/scale (no update), so it cannot
    # change any replica count even if an autoscaler is set to Active (that write fails with Forbidden). Status,
    # events and the leader-election Lease are unchanged.
    scaleWrite: true
    # With scaleWrite true: the Deployments, by name, the operator may write through deployments/scale. Empty: every
    # Deployment where the write role is bound (each of watchNamespaces, or the whole cluster). The names apply in
    # every bound namespace, so pair them with watchNamespaces to limit writes to named Deployments in named
    # namespaces. Reading /scale stays unrestricted. Not allowed with scaleWrite false. RBAC binds the name, not
    # the object: a Deployment recreated under a listed name can be scaled after the operator's next reconcile.
    scaleTargets: []
  # host:port the operator dials instead of the forecaster Service (empty: the Service). For an evaluation-owned route
  # in front of the forecaster (C2.8's scheduled forecast outages). With authentication on, the host must be listed in
  # forecaster.tls.extraDNSNames, so certificate verification stays on.
  forecasterAddress: ""
  forecastLedger:            # the append-only forecast/decision evidence log; off by default
    enabled: false
    persistence:
      existingClaim: ""      # empty: an emptyDir (lost on restart); a claim needs replicas: 1 (the chart uses Recreate)
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
  podLabels: {}             # extra pod labels, e.g. {sidecar.istio.io/inject: "false"}; never the selector keys
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

forecaster:
  # legacyLstm: the TensorFlow forecasting service, its model volume and the training CronJobs (the default).
  # statistical: the light, TensorFlow-free forecaster (forecast contract v2) with its own state volume and no trainers.
  # A Recommend-only preview: it issues shadow forecasts and evidence, and is never eligible for predictive writes
  # before its release gates pass. The default changes only after that evaluation.
  engine: legacyLstm
  statistical:
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "1", memory: 512Mi}
    persistence:             # the forecast journal and fit artifacts: losing it resets every trust epoch
      existingClaim: ""
      storageClass: ""
      size: 2Gi
      retain: true
    stateQuota: 1536Mi       # the journal's own budget inside the volume (database + WAL)
    # C2.8 lab evaluation ONLY: a reviewed lab-qualification/v1 file (docs/helm.md) in a ConfigMap you create. The
    # image must be the EVALUATION build of exactly the source tree the file names, or the forecaster does not start
    # (a release image never honours it); it stands in for the release gate for the named cluster UID, namespaces and
    # target UIDs only, and every runtime trust gate still applies. Also lets the forecaster read the kube-system
    # Namespace (the cluster UID). Empty: off.
    labQualification:
      configMap: ""
      key: lab-qualification.json
    # A scoped LIVE DEMONSTRATION only; never beside labQualification (the chart refuses both). A ConfigMap you create
    # with two reviewed files: a demonstration-qualification/v1 file and the demonstration-contract/v1 file it names
    # by sha256 (docs/helm.md). It is not a release and not an evaluation qualification: it records no gate. Same
    # image rules as above (the evaluation build of the named source tree, pinned by digest), or the forecaster does
    # not start. It stands in for the release gate for one cluster UID, one namespace and at most two target UIDs,
    # only while the live autoscaler is configured as the contract says and only for the forecast families it lists;
    # every runtime trust gate and the operator's own write guards still apply. Also lets the forecaster read the
    # kube-system Namespace (the cluster UID). Empty: off.
    demonstrationQualification:
      configMap: ""
      key: demonstration-qualification.json
      contractKey: demonstration-contract.json
  # Only the operator may call the forecasting service: its projected service account token, checked with TokenReview,
  # over TLS. Off: plain HTTP, and the NetworkPolicies are the only boundary.
  auth:
    enabled: true
    audience: predictive-autoscaler-forecaster
  tls:
    source: selfSigned       # selfSigned (plain Helm; kept with lookup) | certManager | existingSecret (Argo CD: not selfSigned)
    existingSecret: ""       # a Secret with tls.crt, tls.key and ca.crt
    certManager:
      issuerRef: {name: "", kind: Issuer}   # the Issuer's CA must end up in the Secret's ca.crt
      duration: 2160h
      renewBefore: 360h
    selfSigned:
      validityDays: 365      # renewal: delete the Secret, then helm upgrade
    # More names in the certificate (selfSigned, certManager), e.g. operator.forecasterAddress's host. selfSigned keeps an
    # existing Secret on upgrade, so new names need a rotation: delete the Secret, then helm upgrade (docs/helm.md).
    extraDNSNames: []
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 4Gi}
  persistence:               # the model volume, shared with the trainer
    existingClaim: ""        # a claim managed outside the chart: ReadWriteOnce or ReadWriteMany, never ReadWriteOncePod
    storageClass: ""         # empty: the cluster default
    size: 5Gi
    accessMode: ReadWriteOnce  # ReadWriteMany removes the need to schedule the trainer next to the forecaster
    retain: true             # keep the chart-created claim when the release (or its Argo CD Application) is deleted
  tmpSizeLimit: 2Gi
  podLabels: {}             # extra pod labels, e.g. {sidecar.istio.io/inject: "false"}; never the selector keys
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

training:
  # One CronJob per autoscaler to train for: {namespace, name, schedule}. Empty: no training (Recommend mode still
  # reports reactive recommendations).
  targets: []
  hours: 168                 # lookback per training (default seven days; the default model needs >= 235 usable 10-min points)
  epochs: null               # training epochs; null: the trainer's default
  activeDeadlineSeconds: 3600
  resources:
    requests: {cpu: 300m, memory: 2Gi}
    limits: {memory: 6Gi}
  nodeSelector: {}
  tolerations: []

networkPolicy:
  enabled: true              # needs a CNI that enforces NetworkPolicy
  dns:
    namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
    podSelector: {matchLabels: {k8s-app: kube-dns}}
  kubeAPI:
    cidrs: []                # empty: ANY destination on the ports below (weak). Set the addresses your CNI evaluates for the API server; see docs/helm.md
    ports: [443, 6443]
    # true: the standard API allow is left out and a CiliumNetworkPolicy allows these ports to the kube-apiserver
    # entity only (needs Cilium and its CRDs; cidrs must stay empty). See docs/helm.md
    cilium: false
  # Where Prometheus is: at least one selector or ipBlock is required when networkPolicy.enabled.
  prometheus:
    namespaceSelector: {}
    podSelector: {}
    ipBlocks: []             # ["10.0.0.0/8"]
    ports: [9090]
  metricsFrom: []            # peers allowed to scrape the metrics ports: [{namespaceSelector: {...}, podSelector: {...}}]

metrics:
  serviceMonitor: {enabled: false, interval: 30s}   # Prometheus Operator
  vmServiceScrape: {enabled: false, interval: 30s}  # VictoriaMetrics Operator
  # Alert rules on the operator's predictive_autoscaler_condition and model metrics plus the two scrape targets (the
  # rules expect the scrape objects above: job = the Service name). One kind per rule engine.
  alerts:
    prometheusRule: {enabled: false}   # Prometheus Operator
    vmRule: {enabled: false}           # VictoriaMetrics Operator
    labels: {}                         # added to every alert, e.g. {team: platform}
    notReadyFor: 15m                   # Ready=False (reconcile failing)
    telemetryFor: 10m                  # TelemetryAvailable=False (the operator holds the replica count)
    forecastFor: 2h                    # ForecastAvailable=False; expected during the training warm-up
    conflictFor: 5m                    # ConflictDetected=True (another replica writer; the operator writes nothing)
    modelStaleHours: 26                # served model's training cutoff older than this
    absentFor: 10m                     # a scrape target down or missing

# The optional Grafana "Help & Overview" dashboard (dashboards/overview.json): a walkthrough, what every panel and
# alert means, and panels on the operator's metrics. Rendered as a ConfigMap for the Grafana dashboard sidecar.
dashboards:
  enabled: false
  labels:                    # the sidecar loads ConfigMaps with this label; add labels, or set one to null to drop it
    grafana_dashboard: "1"
  annotations: {}            # e.g. {grafana_folder: Predictive Autoscaler} for a sidecar folder annotation

nameOverride: ""
fullnameOverride: ""
