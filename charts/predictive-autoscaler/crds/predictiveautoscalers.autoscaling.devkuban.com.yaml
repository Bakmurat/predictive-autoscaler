                      pendingSeconds:
                        description: |-
                          PendingSeconds is the age of the oldest pod of the current ReplicaSet that has never been Ready (absent when
                          none); a pending start longer than the budget raises the budget, and it is never cut to fit the horizon. Pods
                          that were Ready before (a failed readiness probe, a restarted container), terminal pods (Failed, Succeeded) and
                          terminating pods are not pending starts.
                        format: int32
                        type: integer
                      sampleCount:
                        description: |-
                          SampleCount is the number of completed starts of the current ReplicaSet's pods in the last 7 days that the
                          operator watched (it saw the pod before it was Ready, then Ready). Pods that were already Ready when first
                          seen, for example after an operator restart, and pods that recovered readiness are not samples.
                        format: int32
                        type: integer
                    required:
                    - observable
                    - sampleCount
                    type: object
                  upperWindowMaxRPS:
                    type: string
                  validUntil:
                    format: date-time
                    type: string
                required:
                - calibrationWindows
                - capBinding
                - eligible
                - prospectiveWindows
                type: object
              readyReplicas:
                description: ReadyReplicas is the target's ready replica count observed
                  in the last reconcile (a zero is reported).
                format: int32
                type: integer
              stabilizedReplicas:
                description: |-
                  StabilizedReplicas is what Active mode applies after the scale-down stabilization and cooldown (Active only:
                  Recommend mode keeps no hypothetical scale history, so it is absent there).
                format: int32
                type: integer
              targetUID:
                description: |-
                  TargetUID is the UID of the target Deployment the status describes. When the target is replaced or retargeted,
                  the target-specific history (appliedReplicas, lastScaleTime) is cleared.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
