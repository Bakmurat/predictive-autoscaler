{{- range $component := list "forecaster" "trainer" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pa.fullname" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "pa.labels" $ | nindent 4 }}
---
# The {{ $component }} resolves an autoscaler's compiled query and its live target: read-only, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pa.fullname" $ }}-{{ $component }}
  labels: {{- include "pa.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["autoscaling.devkuban.com"]
    resources: ["predictiveautoscalers"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  {{- if and (eq $component "forecaster") $.Values.forecaster.auth.enabled }}
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pa.fullname" $ }}-{{ $component }}
  labels: {{- include "pa.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pa.fullname" $ }}-{{ $component }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" $ }}-{{ $component }}
    namespace: {{ $.Release.Namespace }}
---
{{- end }}
{{- /* The same read serves a demonstration qualification's scope (one cluster UID); the two are never both set. */}}
{{- if or (include "pa.labQualification" .) (include "pa.demonstrationQualification" .) }}
# C2.8 lab evaluation only: the forecaster reads the cluster's identity (the kube-system Namespace UID) to check a lab
# qualification's scope. One named object, get only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pa.fullname" . }}-forecaster-cluster-identity
  labels: {{- include "pa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pa.fullname" . }}-forecaster-cluster-identity
  labels: {{- include "pa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pa.fullname" . }}-forecaster-cluster-identity
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" . }}-forecaster
    namespace: {{ .Release.Namespace }}
{{- end }}
