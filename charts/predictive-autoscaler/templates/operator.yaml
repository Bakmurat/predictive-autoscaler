{{- $ledger := .Values.operator.forecastLedger }}
{{- /*
operator.writeAllowlist: the reviewed Deployments, by UID, the operator may scale (SCALE_WRITE_ALLOWLIST, entries
namespace/name=uid). The schema checks the same; the template repeats it for --skip-schema-validation and checks what
a schema cannot: one entry per Deployment, and every entry inside the namespaces and names the write role covers (an
entry outside them could never be written, so it is a mistake, not a narrower grant). The value itself must be a
list: null (which removes the default before the schema sees it) or a map would otherwise render no restriction.
*/}}
{{- if not (kindIs "slice" .Values.operator.writeAllowlist) }}
{{- fail "operator.writeAllowlist must be a list (use [] for no restriction by UID): null or any other value would silently remove the restriction" }}
{{- end }}
{{- $allowlist := list }}
{{- $allowSeen := dict }}
{{- range $i, $e := .Values.operator.writeAllowlist }}
{{- if not (kindIs "map" $e) }}{{ fail "operator.writeAllowlist entries must be maps of namespace, name and uid" }}{{ end }}
{{- range $k, $_ := $e }}{{ if not (has $k (list "namespace" "name" "uid")) }}{{ fail (printf "operator.writeAllowlist[%d]: unknown key %q (namespace, name and uid only)" $i $k) }}{{ end }}{{ end }}
{{- range $k := list "namespace" "name" "uid" }}{{ if or (not (hasKey $e $k)) (not (kindIs "string" (get $e $k))) }}{{ fail (printf "operator.writeAllowlist[%d]: %s must be a string" $i $k) }}{{ end }}{{ end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?\\z" $e.namespace) }}{{ fail (printf "operator.writeAllowlist[%d]: %q is not a namespace name" $i $e.namespace) }}{{ end }}
{{- if or (gt (len $e.name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*\\z" $e.name)) }}{{ fail (printf "operator.writeAllowlist[%d]: %q is not a Deployment name" $i $e.name) }}{{ end }}
{{- if not (regexMatch "^[0-9A-Za-z-]{1,64}\\z" $e.uid) }}{{ fail (printf "operator.writeAllowlist[%d]: %q is not a UID" $i $e.uid) }}{{ end }}
{{- $key := printf "%s/%s" $e.namespace $e.name }}
{{- if hasKey $allowSeen $key }}{{ fail (printf "operator.writeAllowlist lists %s more than once" $key) }}{{ end }}
{{- $_ := set $allowSeen $key true }}
{{- if and $.Values.operator.watchNamespaces (not (has $e.namespace $.Values.operator.watchNamespaces)) }}{{ fail (printf "operator.writeAllowlist: %s is outside operator.watchNamespaces, so the operator never reconciles it" $key) }}{{ end }}
{{- if and $.Values.operator.rbac.scaleTargets (not (has $e.name $.Values.operator.rbac.scaleTargets)) }}{{ fail (printf "operator.writeAllowlist: %s is not in operator.rbac.scaleTargets, so the write role does not cover it" $key) }}{{ end }}
{{- $allowlist = append $allowlist (printf "%s=%s" $key $e.uid) }}
{{- end }}
{{- if gt (len $allowlist) 64 }}{{ fail "operator.writeAllowlist lists more than 64 Deployments" }}{{ end }}
{{- if and $allowlist (not .Values.operator.rbac.scaleWrite) }}
{{- fail "operator.writeAllowlist names Deployments the operator may scale, but operator.rbac.scaleWrite is false (no replica write at all): set scaleWrite true or empty writeAllowlist" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pa.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
{{- $ledgerClaim := and $ledger.enabled $ledger.persistence.existingClaim }}
{{- if and $ledgerClaim (gt (int .Values.operator.replicas) 1) }}
{{- fail "operator.forecastLedger.persistence.existingClaim needs operator.replicas: 1 (one pod holds the ledger claim)" }}
{{- end }}
spec:
  replicas: {{ .Values.operator.replicas }}
  {{- if $ledgerClaim }}
  strategy:
    type: Recreate             # the ledger claim may be ReadWriteOnce: the old pod releases it before the new one starts
  {{- end }}
  selector:
    matchLabels: {{- include "pa.selector" (list . "operator") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "pa.selector" (list . "operator") | nindent 8 }}
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.operator.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "pa.fullname" . }}-operator
      securityContext: {{- include "pa.podSecurity" 65532 | nindent 8 }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "pa.image" (list . .Values.images.operator) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            - name: ML_API_URL
              value: {{ include "pa.forecasterURL" . | quote }}
            - name: PROMETHEUS_URL
              value: {{ required "prometheus.url is required" .Values.prometheus.url | quote }}
            {{- with .Values.operator.watchNamespaces }}
            - name: WATCH_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if $allowlist }}
            - name: SCALE_WRITE_ALLOWLIST
              value: {{ join "," $allowlist | quote }}
            {{- end }}
            {{- if $ledger.enabled }}
            - name: FORECAST_LOG
              value: /var/lib/predictive-autoscaler/forecasts.jsonl
            {{- end }}
            {{- if .Values.forecaster.auth.enabled }}
            - name: ML_API_TOKEN_FILE
              value: /var/run/secrets/predictive-autoscaler/forecaster-token/token
            - name: ML_API_CA_FILE
              value: /etc/predictive-autoscaler/forecaster-ca/ca.crt
            {{- end }}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            periodSeconds: 10
          securityContext: {{- include "pa.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- if or $ledger.enabled .Values.forecaster.auth.enabled }}
          volumeMounts:
            {{- if $ledger.enabled }}
            - {name: ledger, mountPath: /var/lib/predictive-autoscaler}
            {{- end }}
            {{- if .Values.forecaster.auth.enabled }}
            - {name: forecaster-token, mountPath: /var/run/secrets/predictive-autoscaler/forecaster-token, readOnly: true}
            - {name: forecaster-ca, mountPath: /etc/predictive-autoscaler/forecaster-ca, readOnly: true}
            {{- end }}
          {{- end }}
      {{- if or $ledger.enabled .Values.forecaster.auth.enabled }}
      volumes:
        {{- if $ledger.enabled }}
        - name: ledger
          {{- if $ledger.persistence.existingClaim }}
          persistentVolumeClaim: {claimName: {{ $ledger.persistence.existingClaim | quote }}}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.forecaster.auth.enabled }}
        - name: forecaster-token     # audience-bound, rotated by the kubelet; read on every request
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.forecaster.auth.audience | quote }}
                  expirationSeconds: 3600
                  path: token
        - name: forecaster-ca        # only the CA: the forecasting service's private key never reaches this pod
          secret:
            secretName: {{ include "pa.forecasterTLSSecret" . }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pa.fullname" . }}-operator-metrics
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pa.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  selector: {{- include "pa.selector" (list . "operator") | nindent 4 }}
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
