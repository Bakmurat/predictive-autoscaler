apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pa.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pa.labels" . | nindent 4 }}
---
# The operator, reads: autoscalers and their targets, every other replica writer in any namespace (coexistence must see
# writers outside the watched namespaces too), its own CRD (the revision gate). Cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pa.fullname" . }}-operator
  labels: {{- include "pa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["autoscaling.devkuban.com"]
    resources: ["predictiveautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaler.example.com"]
    resources: ["predictiveautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["predictiveautoscalers.autoscaling.devkuban.com"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pa.fullname" . }}-operator
  labels: {{- include "pa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pa.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
---
# The operator, writes: replicas only through deployments/scale, its autoscalers' status, events. Bound cluster-wide
# when every namespace is watched; otherwise only in the watched namespaces, so a narrowed install cannot scale anything
# outside them. Leader-election events in the release namespace come from the Lease Role below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pa.fullname" . }}-operator-write
  labels: {{- include "pa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["autoscaling.devkuban.com"]
    resources: ["predictiveautoscalers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- $watch := .Values.operator.watchNamespaces }}
{{- if not $watch }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pa.fullname" . }}-operator-write
  labels: {{- include "pa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pa.fullname" . }}-operator-write
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range ($watch | uniq) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pa.fullname" $ }}-operator-write
  namespace: {{ . }}
  labels: {{- include "pa.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pa.fullname" $ }}-operator-write
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" $ }}-operator
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
---
# Leader election: the Lease in the release namespace only, and its events there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pa.fullname" . }}-operator-lease
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pa.fullname" . }}-operator-lease
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pa.fullname" . }}-operator-lease
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
