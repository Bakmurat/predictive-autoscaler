apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pa.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pa.labels" . | nindent 4 }}
---
# The operator, reads: autoscalers and their targets, every other replica writer in any namespace (coexistence must see
# writers outside the watched namespaces too), its own CRD (the revision gate). Cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pa.fullname" . }}-operator
  labels: {{- include "pa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["autoscaling.devkuban.com"]
    resources: ["predictiveautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaler.example.com"]
    resources: ["predictiveautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["predictiveautoscalers.autoscaling.devkuban.com"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pa.fullname" . }}-operator
  labels: {{- include "pa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pa.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
---
# The operator, writes: replicas only through deployments/scale, its autoscalers' status, events. Bound cluster-wide
# when every namespace is watched; otherwise only in the watched namespaces, so a narrowed install cannot scale anything
# outside them. Leader-election events in the release namespace come from the Lease Role below. With
# operator.rbac.scaleWrite false (a shadow, Recommend-only install) the /scale rule keeps only get: no replica write is
# authorized at all, and an autoscaler set to Active fails its write with Forbidden instead of scaling.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pa.fullname" . }}-operator-write
  labels: {{- include "pa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["autoscaling.devkuban.com"]
    resources: ["predictiveautoscalers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: {{ if .Values.operator.rbac.scaleWrite }}["get", "update"]{{ else }}["get"]{{ end }}
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
# The operator, reads of the targets' own workload objects: the pods of a target's current ReplicaSet and the
# ReplicaSets that resolve them (the startup-delay measurement and ScaleOutBlocked; uncached lists, so no watch). Bound
# like the writes: only where the operator scales. Pod objects carry their spec (environment values included), so this
# read is not cluster-wide unless every namespace is watched.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pa.fullname" . }}-operator-targets
  labels: {{- include "pa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
{{- $watch := .Values.operator.watchNamespaces }}
{{- range $role := list "write" "targets" }}
{{- if not $watch }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pa.fullname" $ }}-operator-{{ $role }}
  labels: {{- include "pa.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pa.fullname" $ }}-operator-{{ $role }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" $ }}-operator
    namespace: {{ $.Release.Namespace }}
{{- else }}
{{- range ($watch | uniq) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pa.fullname" $ }}-operator-{{ $role }}
  namespace: {{ . }}
  labels: {{- include "pa.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pa.fullname" $ }}-operator-{{ $role }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" $ }}-operator
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
---
# Leader election: the Lease in the release namespace only, and its events there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pa.fullname" . }}-operator-lease
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pa.labels" . | nindent 4 }}
rules:
  # create cannot be limited by name (the object does not exist yet); everything else only on the operator's Lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["predictive-autoscaler.autoscaling.devkuban.com"]
    verbs: ["get", "update"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pa.fullname" . }}-operator-lease
  namespace: {{ .Release.Namespace }}
  labels: {{- include "pa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pa.fullname" . }}-operator-lease
subjects:
  - kind: ServiceAccount
    name: {{ include "pa.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
