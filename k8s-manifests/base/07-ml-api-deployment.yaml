apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api
  namespace: ml-engine
  labels:
    app: ml-api
    component: prediction-api
spec:
  replicas: 1  # Single replica with RWO volume
  strategy:
    type: Recreate  # Must use Recreate because RWO PVC can't be multi-attached
  selector:
    matchLabels:
      app: ml-api
  template:
    metadata:
      labels:
        app: ml-api
        component: prediction-api
    spec:
      serviceAccountName: predictive-operator-sa
      containers:
      - name: api
        image: registry.example.com/predictive-autoscaler/predictive-autoscaler-ml-api:v3.9.4
        
        env:
        - name: VICTORIA_METRICS_URL
          valueFrom:
            configMapKeyRef:
              name: victoriametrics-config
              key: victoria_metrics_url
        
        - name: MODEL_DIR
          value: "/models"
        
        - name: LOG_LEVEL
          value: "INFO"
        
        - name: PYTHONUNBUFFERED
          value: "1"
        
        ports:
        - containerPort: 8000
          name: http
        
        volumeMounts:
        - name: models
          mountPath: /models
        
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
        
        # Startup probe gives TensorFlow time to load (300s window)
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30

        # Liveness probe — training is now external (CronJob only)
        # Generous settings retained for model reload stability
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 8

        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
      
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ml-models-pvc
