apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-models-pvc
  namespace: ml-engine
spec:
  accessModes:
    - ReadWriteOnce  # Single writer (training job), ML API reads from HTTP
  resources:
    requests:
      storage: 10Gi
  # storageClassName: <your-storage-class>   (omit to use the cluster default)
