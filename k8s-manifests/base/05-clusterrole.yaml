apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: predictive-operator-role
rules:
# Read/Write Deployments (for scaling)
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "watch", "patch", "update"]

# Read Pods (for current metrics)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

# Read the other replica writers on a target (coexistence check before every write; the operator never changes them)
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]

# KEDA ScaledObjects (optional API: absent is not a conflict)
- apiGroups: ["keda.sh"]
  resources: ["scaledobjects"]
  verbs: ["get", "list", "watch"]

# VerticalPodAutoscalers (optional API; reported as the VPAInterference warning)
- apiGroups: ["autoscaling.k8s.io"]
  resources: ["verticalpodautoscalers"]
  verbs: ["get", "list", "watch"]

# Read ConfigMaps (for application config)
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

# Emit Kubernetes events (condition transitions, scaling actions)
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]

# Access PredictiveAutoscaler CRD
- apiGroups: ["autoscaler.example.com"]
  resources: ["predictiveautoscalers"]
  verbs: ["get", "list", "watch", "patch", "update"]

- apiGroups: ["autoscaler.example.com"]
  resources: ["predictiveautoscalers/status"]
  verbs: ["get", "patch", "update"]

# Create jobs (for ML API cold-start trigger)
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create"]

# The API's cold start runs `kubectl create job --from=cronjob/ml-training`, which reads the CronJob first;
# without get on cronjobs that call is denied (found by code review on 2026-10-05; not observed live).
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "list"]
