# prodcluster overlay for the `demo` namespace: the six benchmark arms, their Services, PredictiveAutoscalers and
# KEDA ScaledObjects, and the six k6 generators, taken unchanged from deploy/eks-benchmark except:
#   - every generator mounts the challenge-v1 script (on EKS five of the six were switched by hand; repo drift fixed)
#     and opens a new connection per request (K6_NO_VU_CONNECTION_REUSE, see the patch); the script also counts failed
#     requests in a dense counter (D-1083), recorded as a pod-template annotation;
#   - nginx-ensemble loses its EKS zone pin (ap-southeast-1b);
#   - all six arms carry predictive-bench/role=arm, a soft per-arm hostname spread and stay off the ML node;
#   - all six arms record their final request counters when a pod terminates (final-snapshot.sh, see the patch);
#   - VM_QUERY_URL / VM_WRITE_URL placeholders are substituted by ../deploy.sh.
# The files live outside this directory, so render with: kustomize build --load-restrictor LoadRestrictionsNone
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../eks-benchmark/demo/00-namespace.yaml
  - ../../eks-benchmark/workload/challenge-v1/k6-load-script-challenge-v1.yaml
  # arm 1: hybrid (operator, forecasting on) + paused KEDA fallback
  - ../../eks-benchmark/demo/nginx-test-deployment.yaml
  - ../../eks-benchmark/demo/nginx-test-service.yaml
  - ../../eks-benchmark/demo/nginx-test-predictive-autoscaler.yaml
  - ../../eks-benchmark/demo/nginx-test-keda-fallback.yaml
  - ../../eks-benchmark/demo/k6-nginx-test-deployment.yaml
  # arm 2: reactive (operator, forecasting off)
  - ../../eks-benchmark/demo/nginx-reactive-deployment.yaml
  - ../../eks-benchmark/demo/nginx-reactive-service.yaml
  - ../../eks-benchmark/demo/nginx-reactive-predictive-autoscaler.yaml
  - ../../eks-benchmark/demo/k6-nginx-reactive-deployment.yaml
  # arm 3: KEDA
  - ../../eks-benchmark/demo/myapptwo-deployment.yaml
  - ../../eks-benchmark/demo/myapptwo-service.yaml
  - ../../eks-benchmark/demo/myapptwo-keda-fallback.yaml
  - ../../eks-benchmark/demo/k6-myapptwo-deployment.yaml
  # arm 4: S1 seasonal pattern only
  - ../../eks-benchmark/experiments/seasonal-pattern-v1/nginx-seasonal-deployment.yaml
  - ../../eks-benchmark/experiments/seasonal-pattern-v1/nginx-seasonal-service.yaml
  - ../../eks-benchmark/experiments/seasonal-pattern-v1/nginx-seasonal-predictive-autoscaler.yaml
  - ../../eks-benchmark/experiments/seasonal-pattern-v1/k6-nginx-seasonal-deployment.yaml
  # arm 5: E1 seasonal ensemble, q90 margin
  - ../../eks-benchmark/experiments/seasonal-ensemble-v1/nginx-ensemble-deployment.yaml
  - ../../eks-benchmark/experiments/seasonal-ensemble-v1/nginx-ensemble-service.yaml
  - ../../eks-benchmark/experiments/seasonal-ensemble-v1/nginx-ensemble-predictive-autoscaler.yaml
  - ../../eks-benchmark/experiments/seasonal-ensemble-v1/k6-nginx-ensemble-deployment.yaml
  # arm 6: E2 seasonal ensemble, q95 margin
  - ../../eks-benchmark/experiments/seasonal-ensemble-q95-v1/nginx-ensemble-q95-deployment.yaml
  - ../../eks-benchmark/experiments/seasonal-ensemble-q95-v1/nginx-ensemble-q95-service.yaml
  - ../../eks-benchmark/experiments/seasonal-ensemble-q95-v1/nginx-ensemble-q95-predictive-autoscaler.yaml
  - ../../eks-benchmark/experiments/seasonal-ensemble-q95-v1/k6-nginx-ensemble-q95-deployment.yaml
configMapGenerator:
  - name: final-snapshot-script
    namespace: demo
    files: [ final-snapshot.sh ]
patches:
  # K6_NO_VU_CONNECTION_REUSE (k6 env options override script options; the script is unchanged): the generators
  # have no sidecar and Cilium balances per connection, so with keep-alive every VU connection opened while an arm had
  # one pod stayed on that pod and replicas added later received no requests (measured 2026-10-05 06:01-06:27Z: zero
  # on every new pod). One GET per iteration, so this opens a connection per request and spreads it over Ready pods.
  - target: { kind: Deployment, labelSelector: "app=k6" }
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0/configMap/name
        value: k6-load-script-challenge-v1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: K6_NO_VU_CONNECTION_REUSE, value: "true" }
      # D-1083: the script gained a dense failure counter and a 30-day schedule; a ConfigMap change alone does not
      # restart k6, so the script revision is part of the pod template and every generator restarts with it (Recreate).
      - op: add
        path: /spec/template/metadata/annotations/predictive-bench~1k6-script
        value: challenge-v1+bench_req_failed+days30
      # D-1096 (2026-10-08): with the 30-day schedule (8,641 stages) k6 idles at ~350 MiB and grows with the request rate;
      # from ~08:00Z on 10-08 every generator was OOMKilled at the 384Mi limit as the morning rate rose (crash loop).
      # Request 512Mi, limit 1Gi (the daily peak is ~6,900 rpm).
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
  # U-31: E2 serves the relative q90 margin (ml-api ENSEMBLE_EXPERIMENT); the autoscaler's label and description say so.
  - target: { kind: PredictiveAutoscaler, name: nginx-ensemble-q95-autoscaler }
    patch: |-
      - op: replace
        path: /metadata/labels/experiment
        value: seasonal-ensemble-rq90-v1
      - op: replace
        path: /metadata/annotations/description
        value: "Seasonal ensemble (Holt-Winters + 7-day profile/AR) with relative q90 margin (U-31), forecast from demo/nginx-test; own reactive demand"
  - target: { kind: Deployment, name: nginx-ensemble }
    patch: |-
      - op: remove
        path: /spec/template/spec/affinity
  # Arm placement on a shared cluster: per-arm hostname spread (soft, taints honoured), arms kept off the ML node.
  - target: { kind: Deployment, labelSelector: "app in (nginx-test,nginx-reactive,myapptwo,nginx-seasonal,nginx-ensemble,nginx-ensemble-q95)" }
    patch: |-
      # The per-arm hard spread (constraint 0, maxSkew 1, DoNotSchedule) defaults to nodeTaintsPolicy Ignore, so the
      # tainted control-plane node counts as a domain holding zero pods: with five workers no arm could exceed five
      # replicas (the sixth pod stayed Pending on 2026-10-05 from 10:02Z). Honor excludes nodes the pod cannot use.
      - op: add
        path: /spec/template/spec/topologySpreadConstraints/0/nodeTaintsPolicy
        value: Honor
      # Shared cluster, nodes at 68-92 % of CPU requested (2026-10-05 12:08Z): a hard spread leaves an arm's pods
      # Pending as soon as one node is full although others have room (the autoscalers' decisions would then not be
      # carried out). The spread stays a preference; capacity decides placement.
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: ScheduleAnyway
      # Arm pods stay off the ML node: there they took the CPU the six-hourly trainer needs (it must run next to
      # ml-api and its RWO model volume) and its 12:00Z pod stayed Pending ("Insufficient cpu").
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: predictive-bench/ml-node, operator: DoesNotExist}
      # The collective soft spread over all arms (role=arm) was dropped on 2026-10-05: with the per-arm spread soft too,
      # the two constraints share server-side apply's list key (topologyKey, whenUnsatisfiable) and the API rejects
      # the Deployment; the per-arm soft spread plus the scheduler's least-allocated scoring spread the arms.
      - op: add
        path: /spec/template/metadata/labels/predictive-bench~1role
        value: arm
  # Final snapshot (Codex Task 03 r18/r19): when an arm pod terminates, its nginx preStop hook (final-snapshot.sh)
  # stops Envoy's inbound listeners, waits until no inbound connection or request is left, and pushes the final
  # istio_* counters as bench_final_istio_* plus a receipt to VictoriaMetrics, so requests served after the pod's last
  # scrape are not lost to the hourly load evidence. Envoy must outlive the hook (terminationDrainDuration 60 s; the
  # hook's worst case, every request timing out, is 51 s) and the pod must outlive Envoy (grace period 75 s). The inbound gauges the hook reads are not exported by
  # Istio by default.
  - target: { kind: Deployment, labelSelector: "app in (nginx-test,nginx-reactive,myapptwo,nginx-seasonal,nginx-ensemble,nginx-ensemble-q95)" }
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/proxy.istio.io~1config
        value: |
          terminationDrainDuration: 60s
          proxyStatsMatcher:
            inclusionRegexps:
              - "listener\\.0\\.0\\.0\\.0_15006\\.downstream_(pre_)?cx_active"
              - "http\\.inbound_.*\\.downstream_rq_active"
      - op: add
        path: /spec/template/spec/terminationGracePeriodSeconds
        value: 75
      - op: add
        path: /spec/template/spec/volumes
        value:
          - { name: final-snapshot, configMap: { name: final-snapshot-script, defaultMode: 365 } }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - { name: final-snapshot, mountPath: /opt/final-snapshot, readOnly: true }
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          - { name: POD_UID, valueFrom: { fieldRef: { fieldPath: metadata.uid } } }
          - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          - { name: SNAPSHOT_URL, value: "VM_IMPORT_URL" }
      - op: add
        path: /spec/template/spec/containers/0/lifecycle
        value:
          preStop: { exec: { command: ["/bin/sh", "/opt/final-snapshot/final-snapshot.sh"] } }
