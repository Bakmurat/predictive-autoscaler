# The image registry project may require credentials: pods that run the benchmark images reference the
# docker-registry Secret `harbor-creds` in ml-engine (created outside this repository; never committed).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api
  namespace: ml-engine
spec:
  template:
    spec:
      imagePullSecrets:
        - name: harbor-creds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-operator
  namespace: ml-engine
spec:
  template:
    spec:
      imagePullSecrets:
        - name: harbor-creds
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-training
  namespace: ml-engine
spec:
  jobTemplate:
    spec:
      template:
        spec:
          imagePullSecrets:
            - name: harbor-creds
