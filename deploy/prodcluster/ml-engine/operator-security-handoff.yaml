# Codex Task 03 round 27 (C-102, C-104).
#
# fsGroup: the operator image is distroless and runs as USER 65532:65532, but the forecast-log PVC is
# an ext4 EBS volume whose root directory is owned by root:root 0755, so the operator could not create
# or append forecasts.jsonl ("permission denied" on every issuance). A pod-level fsGroup makes the
# kubelet chown the volume root to group 65532 with the setgid bit; OnRootMismatch skips the recursive
# walk once the root already matches. Neither setting is proof of writability on its own: verify an
# append by the operator process itself.
#
# strategy Recreate: the operator appends to the ReadWriteOnce forecast-log volume, so only one pod may run.
# (Images built before leader election became the default, as in the benchmark campaign, also need it so that
# two active controllers never overlap; with leader election on, a surge pod would wait for the Lease.)
# Recreate stops the old pod before the new one starts; the cost is a short control interruption, which each
# rollout records.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-operator
  namespace: ml-engine
spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
