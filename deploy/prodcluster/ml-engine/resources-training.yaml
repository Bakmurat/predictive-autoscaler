apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-training
  namespace: ml-engine
spec:
  jobTemplate:
    spec:
      # A full seven-day window (1,008 points, ~850 sequences x 50 epochs of a BiLSTM on one t4g.medium
      # core) needs more than the base manifest's 10 minutes; 25 minutes is well inside the 6-hour cadence.
      # One retry only: a second attempt against the same data would fail the same way (Forbid stays).
      activeDeadlineSeconds: 1500
      backoffLimit: 1
      template:
        spec:
          containers:
            - name: trainer
              resources:
                # D-1100 (2026-10-09): 300m (was 500m) — the ML node's CPU requests leave no room for 500m since other
                # workloads grew there (the 2026-10-09 00Z training stayed Pending until its deadline); the 2-CPU limit
                # is unchanged, but under contention a smaller request also means a smaller CPU share (Codex r70).
                requests: { cpu: 300m, memory: 768Mi }
                limits: { cpu: "2", memory: 2Gi }
