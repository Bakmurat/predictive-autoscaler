---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-reactive
  namespace: demo
  labels:
    app: nginx-reactive
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-reactive
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # rollout overlap bounded to one extra pod per app (budget, Codex C-12)
  template:
    metadata:
      labels:
        app: nginx-reactive
      annotations:
        sidecar.istio.io/proxyCPU: "25m"       # measured: ~63m at 100 req/s per pod (2 replicas), ~10m at the 10 req/s per-replica target; CPU is the binding constraint on two t4g.medium
        sidecar.istio.io/proxyCPULimit: "200m"
        sidecar.istio.io/proxyMemory: "48Mi"
        sidecar.istio.io/proxyMemoryLimit: "128Mi"
    spec:
      # Replicas spread evenly across the two nodes (max skew 1), so each node's share of the
      # 12-replica ceiling is at most 6 per app (Codex C-12: enforced placement, not assumed).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nginx-reactive
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
