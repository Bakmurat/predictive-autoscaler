apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: myapptwo-keda-fallback
  namespace: demo
  labels:
    app: myapptwo
    scaler-type: reactive-fallback
  annotations:
    description: "KEDA reactive fallback for myapptwo"
    predictive-autoscaler-name: "myapptwo-autoscaler"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapptwo

  # Must match PredictiveAutoscaler boundaries
  minReplicaCount: 1
  maxReplicaCount: 12

  # Reactive polling - checks frequently for safety
  pollingInterval: 10        # Check every 10 seconds
  cooldownPeriod: 180        # 3 min cooldown before scale-down

  # Scaling behavior - fast up, slow down
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600  # 10 min stabilization — must be longer than
                                           # operator reconciliation interval (5min) to
                                           # prevent operator-KEDA micro-oscillation
          policies:
          - type: Pods
            value: 1
            periodSeconds: 300   # Remove 1 pod every 5 min (was 3 min)
          - type: Percent
            value: 10
            periodSeconds: 300   # Or 10% every 5 min
          selectPolicy: Min      # Conservative scale-down

        scaleUp:
          stabilizationWindowSeconds: 0   # Immediate scale-up
          policies:
          - type: Percent
            value: 100           # Double capacity
            periodSeconds: 15
          - type: Pods
            value: 4             # Or add 4 pods
            periodSeconds: 15
          selectPolicy: Max      # Aggressive scale-up

  # Single trigger, same request-count definition and per-replica target as the operator's
  # reactive rule (KEDA desired = ceil(value / threshold)). CPU and memory triggers were removed on
  # purpose so that this is a like-for-like system comparison of the reactive policy.
  triggers:
  - type: prometheus
    metadata:
      serverAddress: VM_QUERY_URL
      query: |
        sum(rate(istio_requests_total{reporter="destination",destination_workload="myapptwo",destination_workload_namespace="demo"}[1m])) * 60
      threshold: "600"             # 10 req/s per replica = 600 req/min per replica
      activationThreshold: "60"
