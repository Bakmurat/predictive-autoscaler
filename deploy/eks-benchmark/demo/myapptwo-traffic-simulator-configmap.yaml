---
apiVersion: v1
kind: ConfigMap
metadata:
  name: myapptwo-traffic-simulator
  namespace: demo
  labels:
    app: myapptwo-traffic-simulator
data:
  traffic-simulator.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    
    // Time-Aware Traffic Simulator for Nginx Test
    // Generates traffic based on CURRENT PST hour for realistic oscillating patterns
    // Traffic goes through Istio Ingress Gateway LoadBalancer address for realistic simulation
    
    const TARGET_URL = 'http://myapptwo.demo.svc.cluster.local/';
    
    // Get current hour in PST (Pacific Standard Time - UTC-8)
    function getCurrentHourPST() {
      const now = new Date();
      const utcHour = now.getUTCHours();
      const pstHour = (utcHour - 8 + 24) % 24;
      return pstHour;
    }
    
    // Traffic pattern map: hour -> requests per minute
    const TRAFFIC_PATTERN = {
      // Night: 12 AM - 5 AM PST (Minimal Traffic)
      0: 250,   // Midnight
      1: 200,
      2: 150,
      3: 150,
      4: 200,
      5: 300,
      
      // Morning Ramp-Up: 6 AM - 8 AM PST (Rising Traffic)
      6: 750,  // Morning starts
      7: 1250,
      8: 2000,
      
      // Morning Peak: 9 AM - 11 AM PST (Very High Traffic)
      9: 3000,
      10: 3750,
      11: 4250,
      
      // Lunch Window: 12 PM - 1 PM PST (High Traffic)
      12: 4500,   // 12 PM
      13: 5000,  // 1 PM
      
      // Afternoon Peak: 2 PM - 4 PM PST (Maximum at 3 PM)
      14: 5500,  // 2 PM
      15: 6000,  // PEAK AFTERNOON HOUR ⚡
      16: 5000,   // 4 PM
      
      // Evening Decline: 5 PM - 8 PM PST (Decreasing Traffic)
      17: 4250,   // 5 PM
      18: 3000,   // 6 PM
      19: 2400,   // 7 PM
      20: 1000,   // 8 PM
      
      // Night Wind-Down: 9 PM - 11 PM PST (Low Traffic)
      21: 600,   // 9 PM
      22: 400,    // 10 PM
      23: 300,    // 11 PM
    };
    
    // Calculate the 4-hour traffic schedule at script load time
    const CURRENT_HOUR = getCurrentHourPST();
    const HOUR_1_RATE = TRAFFIC_PATTERN[CURRENT_HOUR];
    const HOUR_2_RATE = TRAFFIC_PATTERN[(CURRENT_HOUR + 1) % 24];
    const HOUR_3_RATE = TRAFFIC_PATTERN[(CURRENT_HOUR + 2) % 24];
    const HOUR_4_RATE = TRAFFIC_PATTERN[(CURRENT_HOUR + 3) % 24];
    
    // k6 options - ramping arrival rate that changes every hour
    export const options = {
      discardResponseBodies: true,
      scenarios: {
        time_aware_load: {
          executor: 'ramping-arrival-rate',
          startRate: HOUR_1_RATE,
          timeUnit: '1m',
          preAllocatedVUs: 30,
          maxVUs: 300,
          stages: [
            { duration: '1h', target: HOUR_1_RATE },
            { duration: '1h', target: HOUR_2_RATE },
            { duration: '1h', target: HOUR_3_RATE },
            { duration: '1h', target: HOUR_4_RATE },
          ],
        },
      },
    };
    
    export default function () {
      const response = http.get(TARGET_URL);
      check(response, {
        'status is 200': (r) => r.status === 200,
      });
    }
    
    // Setup function - displays the traffic schedule
    export function setup() {
      const now = new Date();
      
      const trafficSchedule = [
        { hour: CURRENT_HOUR, rate: HOUR_1_RATE },
        { hour: (CURRENT_HOUR + 1) % 24, rate: HOUR_2_RATE },
        { hour: (CURRENT_HOUR + 2) % 24, rate: HOUR_3_RATE },
        { hour: (CURRENT_HOUR + 3) % 24, rate: HOUR_4_RATE },
      ];
      
      console.log('==========================================');
      console.log('Nginx Test k6 Traffic Simulator Started');
      console.log('Mode: Time-Aware Hourly Ramping Traffic');
      console.log(`Target: ${TARGET_URL}`);
      console.log(`Current Time (UTC): ${now.toISOString()}`);
      console.log(`Current PST Hour: ${CURRENT_HOUR}:${String(now.getUTCMinutes()).padStart(2, '0')}`);
      console.log('');
      console.log('Next 4 Hours Traffic Schedule:');
      trafficSchedule.forEach((item, index) => {
        const hourLabel = `${String(item.hour).padStart(2, '0')}:00`;
        const rateLabel = `${(item.rate / 1000).toFixed(0)}k`;
        const bar = '█'.repeat(Math.floor(item.rate / 5000));
        console.log(`  Hour ${index + 1} (${hourLabel} PST): ${rateLabel.padStart(6)} req/min ${bar}`);
      });
      console.log('');
      console.log('Full 24-Hour Pattern Reference:');
      console.log('  00-05 AM (Night):      1.5k - 3k req/min    ▁');
      console.log('  06-08 AM (Morning):   7.5k - 20k req/min   ▃▅▆');
      console.log('  09-11 AM (Peak):      30k - 42.5k req/min   ███');
      console.log('  12-01 PM (Lunch):     45k - 50k req/min  ████');
      console.log('  02-04 PM (Afternoon): 50k - 60k req/min  █████ ⚡');
      console.log('  05-08 PM (Evening):   10k - 42.5k req/min   ▅▃▂');
      console.log('  09-11 PM (Night):     3k - 6k req/min    ▁');
      console.log('');
      console.log('Traffic changes EVERY HOUR - Monitor KEDA scaling!');
      console.log('Duration: 4 hours, then pod restarts');
      console.log('==========================================');
      
      return { 
        startTime: now.toISOString(), 
        startHour: CURRENT_HOUR,
        schedule: trafficSchedule 
      };
    }
    
    // Teardown function
    export function teardown(data) {
      if (data && data.startTime) {
        const now = new Date();
        console.log('==========================================');
        console.log('4-Hour Traffic Cycle Completed');
        console.log(`Started: ${data.startTime} (Hour ${data.startHour} PST)`);
        console.log(`Ended:   ${now.toISOString()}`);
        console.log('Pod will restart to continue with next 4 hours...');
        console.log('==========================================');
      }
    }
