---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapptwo-traffic-simulator
  namespace: demo
  labels:
    app: myapptwo-traffic-simulator
spec:
  replicas: 1   # one generator per app (evaluation protocol)
  selector:
    matchLabels:
      app: myapptwo-traffic-simulator
  template:
    metadata:
      labels:
        app: myapptwo-traffic-simulator
    spec:
      containers:
      - name: k6
        image: grafana/k6:0.48.0
        command: ["k6"]
        args: ["run", "--quiet", "/scripts/traffic-simulator.js"]
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: script
        configMap:
          name: myapptwo-traffic-simulator
          defaultMode: 0755
      restartPolicy: Always
