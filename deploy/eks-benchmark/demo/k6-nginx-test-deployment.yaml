---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-nginx-test
  namespace: demo
  labels:
    app: k6
    target: nginx-test
spec:
  replicas: 1
  strategy:
    type: Recreate   # never two generators for one app at once (the rate would double during a rollout)
  selector:
    matchLabels:
      app: k6
      target: nginx-test
  template:
    metadata:
      labels:
        app: k6
        target: nginx-test
      annotations:
        sidecar.istio.io/inject: "false"   # requests are counted by the destination sidecar (reporter="destination")
    spec:
      # Generators never share a node with ml-api (whose node also hosts the training job), so the
      # training node's budget is deterministic (Codex C-12).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: ml-api }
              namespaces: [ml-engine]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: k6
          image: grafana/k6:0.48.0
          args: ["run", "--quiet", "-o", "experimental-prometheus-rw", "--tag", "testid=nginx-test", "/scripts/load.js"]
          env:
            - name: TARGET_URL
              value: "http://nginx-test.demo.svc.cluster.local/"
            - name: TARGET_NAME
              value: "nginx-test"
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "VM_WRITE_URL"
            - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
              value: "10s"
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(95),p(99),avg"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: k6-load-script
