---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-myapptwo
  namespace: demo
  labels:
    app: k6
    target: myapptwo
spec:
  schedule: "0 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 72
  failedJobsHistoryLimit: 24
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3570
      template:
        metadata:
          labels:
            app: k6
            target: myapptwo
          annotations:
            sidecar.istio.io/inject: "false"   # requests are counted by the destination sidecar (reporter="destination")
        spec:
          restartPolicy: Never
          # Generators never share a node with ml-api (whose node also hosts the training job), so
          # the training node's budget is deterministic (Codex C-12).
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: { app: ml-api }
                  namespaces: [ml-engine]
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: k6
              image: grafana/k6:0.48.0
              args: ["run", "--quiet", "/scripts/load.js"]
              env:
                - name: TARGET_URL
                  value: "http://myapptwo.demo.svc.cluster.local/"
                - name: TARGET_NAME
                  value: "myapptwo"
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: k6-load-script
