---
# PredictiveAutoscaler CR for nginx-reactive
# UNIFIED SCALER - Single source of truth for deployment replicas
#
# Combines predictive (ML) and reactive (current metrics) into one decision:
#   desired = max(predicted_baseline, reactive_needed, minReplicas)
#
# - Predicted baseline: LSTM predicts RPM within leadTimeMinutes window
# - Reactive floor: current RPM from VictoriaMetrics (catches under-prediction)
# - Scale-up: immediate
# - Scale-down: stabilized (5 min wait, then gradual reduction)
# - KEDA is paused — this operator is the sole replica controller
#
apiVersion: autoscaler.example.com/v1alpha1
kind: PredictiveAutoscaler
metadata:
  name: nginx-reactive-autoscaler
  namespace: demo
  labels:
    app: nginx-reactive
    scaler-type: reactive-control
  annotations:
    description: "Matched control: same operator, same reactive rule, forecasting disabled"
spec:
  targetDeployment:
    name: nginx-reactive
    namespace: demo
    container: nginx

  minReplicas: 1
  maxReplicas: 12

  metrics:
    # Request rate is PRIMARY metric (leading indicator)
    # Matches Grafana: sum(rate(istio_requests_total{...}[1m]))
    # Same request-count definition and per-replica target as the KEDA comparison
    requests:
      enabled: true
      targetRPS: 10          # requests/s per replica; same value in the KEDA comparison

    # CPU as supplementary signal
    cpu:
      enabled: true
      targetPercent: 70

    # Memory as supplementary signal
    memory:
      enabled: true
      targetPercent: 70

  prediction:
    enabled: false            # reactive-only control (forecast switch off)
    horizonMinutes: 60          # ML API predicts 1 hour ahead (full context)
    leadTimeMinutes: 20         # Use predictions within 20-min window for scaling
    updateIntervalSeconds: 60   # Reconcile every 60s (reactive needs fast cycles)

  resources:
    cpuRequestMillicores: 10    # From nginx-deployment.yaml: cpu: 20m
    memoryRequestMB: 16         # From nginx-deployment.yaml: memory: 32Mi
    baselineRPM: 6000          # Baseline RPM at 2 replicas (night minimum ~3k, peak ~120k)
