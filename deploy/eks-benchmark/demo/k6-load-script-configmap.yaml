---
# Shared k6 load script. One Job per app per UTC hour (see k6-*-cronjob.yaml): each Job runs a
# constant arrival rate taken from PATTERN_UTC for the current UTC hour and stops ~30 s before the
# next hour, so every generator is aligned to wall-clock UTC hours and independent of restarts.
# The summary is printed as one JSON line at the end (kept in the Job's logs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-load-script
  namespace: demo
data:
  load.js: |
    import http from 'k6/http';

    // Requests per minute by UTC hour (synthetic daily pattern: night trough, morning ramp,
    // afternoon peak at 15:00 UTC, evening decline). Peak 6,000 req/min = 100 req/s.
    const PATTERN_UTC = {
      0: 250, 1: 200, 2: 150, 3: 150, 4: 200, 5: 300,
      6: 750, 7: 1250, 8: 2000,
      9: 3000, 10: 3750, 11: 4250,
      12: 4500, 13: 5000, 14: 5500, 15: 6000, 16: 5000,
      17: 4250, 18: 3000, 19: 2400, 20: 1000,
      21: 600, 22: 400, 23: 300,
    };

    const now = new Date();
    const HOUR = now.getUTCHours();
    const RATE = PATTERN_UTC[HOUR];
    const secondsIntoHour = now.getUTCMinutes() * 60 + now.getUTCSeconds();
    const DURATION = Math.max(60, 3600 - secondsIntoHour - 30);  // end 30 s before the next hour

    export const options = {
      discardResponseBodies: true,
      scenarios: {
        hour: {
          executor: 'constant-arrival-rate',
          rate: RATE,
          timeUnit: '1m',
          duration: `${DURATION}s`,
          preAllocatedVUs: 30,   // enough VUs from the first second so the arrival rate is met without drops
          maxVUs: 60,            // 100 req/s at in-cluster latency needs a handful; 60 bounds memory
        },
      },
    };

    // setup() runs once at the start; its return value reaches handleSummary as data.setup_data, so the
    // summary reports the planned values of the hour that actually ran (handleSummary re-runs the init
    // context at the end, where `now` would be stale).
    export function setup() {
      return { started_at: now.toISOString(), utc_hour: HOUR, planned_rpm: RATE, planned_duration_s: DURATION };
    }

    export default function () {
      http.get(__ENV.TARGET_URL);
    }

    export function handleSummary(data) {
      const m = data.metrics;
      const pick = (k) => (m[k] ? m[k].values : null);
      const plan = data.setup_data || {};
      const plannedRequests = Math.round((plan.planned_rpm || 0) * (plan.planned_duration_s || 0) / 60);
      const reqs = pick('http_reqs') ? pick('http_reqs').count : 0;
      const dropped = pick('dropped_iterations') ? pick('dropped_iterations').count : 0;
      const failed = pick('http_req_failed') ? pick('http_req_failed').passes : 0;
      const summary = {
        kind: 'k6-hour-summary',
        format: 2,
        target: __ENV.TARGET_NAME,
        utc_hour: plan.utc_hour,
        planned_rpm: plan.planned_rpm,
        planned_duration_s: plan.planned_duration_s,
        planned_requests: plannedRequests,
        started_at: plan.started_at,
        run_duration_s: Math.round(data.state.testRunDurationMs / 1000),
        http_reqs: reqs,
        delivered_pct: plannedRequests ? Math.round(10000 * reqs / plannedRequests) / 100 : null,
        dropped_iterations: dropped,
        dropped_pct: plannedRequests ? Math.round(100000 * dropped / plannedRequests) / 1000 : null,
        http_req_failed: failed,
        failed_pct: reqs ? Math.round(100000 * failed / reqs) / 1000 : null,
        http_req_duration_ms: pick('http_req_duration'),
        vus_max: pick('vus_max') ? pick('vus_max').value : null,
      };
      return { stdout: JSON.stringify(summary) + '\n' };
    }
