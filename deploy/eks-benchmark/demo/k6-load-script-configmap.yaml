---
# Shared k6 load script: ONE long-running generator per app (see k6-*-deployment.yaml) that follows the
# synthetic daily pattern as a wall-clock-aligned step schedule (ramping-arrival-rate with a 1-second
# ramp at every UTC hour boundary, then a hold). A long-lived process, not hourly Jobs, so the request
# rate never stops at the top of the hour (hourly Jobs left a restart gap that biased every :00 sample
# of the ten-minute series low). k6's own metrics go to Prometheus by remote write; hourly load
# summaries (delivered vs planned, dropped, failed) are derived from Prometheus, not from logs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-load-script
  namespace: demo
data:
  load.js: |
    import http from 'k6/http';

    // Requests per minute by UTC hour (synthetic daily pattern: night trough, morning ramp,
    // afternoon peak at 15:00 UTC, evening decline). Peak 6,000 req/min = 100 req/s.
    export const PATTERN_UTC = {
      0: 250, 1: 200, 2: 150, 3: 150, 4: 200, 5: 300,
      6: 750, 7: 1250, 8: 2000,
      9: 3000, 10: 3750, 11: 4250,
      12: 4500, 13: 5000, 14: 5500, 15: 6000, 16: 5000,
      17: 4250, 18: 3000, 19: 2400, 20: 1000,
      21: 600, 22: 400, 23: 300,
    };

    const DAYS = 8;                       // schedule length; k6 exits afterwards and the Deployment
                                          // restarts it, re-aligned to the wall clock
    const now = new Date();
    const hour0 = now.getUTCHours();
    const secondsIntoHour = now.getUTCMinutes() * 60 + now.getUTCSeconds();
    const stages = [{ duration: `${Math.max(1, 3600 - secondsIntoHour)}s`, target: PATTERN_UTC[hour0] }];
    for (let h = 1; h <= DAYS * 24; h++) {
      const r = PATTERN_UTC[(hour0 + h) % 24];
      stages.push({ duration: '1s', target: r });      // step at the hour boundary
      stages.push({ duration: '3599s', target: r });   // hold for the rest of the hour
    }

    export const options = {
      discardResponseBodies: true,
      scenarios: {
        pattern: {
          executor: 'ramping-arrival-rate',
          startRate: PATTERN_UTC[hour0],
          timeUnit: '1m',
          preAllocatedVUs: 30,   // enough VUs from the first second so the arrival rate is met without drops
          maxVUs: 60,
          stages,
          gracefulStop: '5s',
        },
      },
    };

    export function setup() {
      console.log(JSON.stringify({ kind: 'k6-schedule', target: __ENV.TARGET_NAME, started_at: now.toISOString(),
                                   start_hour: hour0, start_rate_rpm: PATTERN_UTC[hour0], stages: stages.length, days: DAYS }));
    }

    export default function () {
      http.get(__ENV.TARGET_URL);
    }

    export function handleSummary(data) {
      const m = data.metrics;
      const pick = (k) => (m[k] ? m[k].values : null);
      return { stdout: JSON.stringify({ kind: 'k6-run-summary', target: __ENV.TARGET_NAME,
        run_duration_s: Math.round(data.state.testRunDurationMs / 1000), http_reqs: pick('http_reqs'),
        dropped_iterations: pick('dropped_iterations'), http_req_failed: pick('http_req_failed'),
        http_req_duration: pick('http_req_duration'), vus_max: pick('vus_max') }) + '\n' };
    }
