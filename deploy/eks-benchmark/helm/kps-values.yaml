# kube-prometheus-stack, minimal and cheap: one Prometheus, Grafana, no alerting
alertmanager:
  enabled: false
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 15d
    scrapeInterval: 30s
    resources:
      requests: { cpu: 200m, memory: 700Mi }   # measured working set ~600Mi at 15d retention
      limits: { memory: 1200Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 20Gi } }
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
grafana:
  enabled: true
  persistence:
    enabled: true
    storageClassName: gp3
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 320Mi }               # measured ~200Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: monitoring
  defaultDashboardsEnabled: false
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
nodeExporter:
  enabled: false
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  create: false
