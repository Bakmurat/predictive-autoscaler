apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-training
  namespace: ml-engine
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: trainer
              resources:
                requests: { cpu: 500m, memory: 768Mi }   # provisional until measured on the final nodes (see evaluation-protocol.md)
                limits: { cpu: "2", memory: 2Gi }
