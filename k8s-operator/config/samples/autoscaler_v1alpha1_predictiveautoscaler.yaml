# A minimal PredictiveAutoscaler (fields this version of the operator actually reads).
#
# The operator scales the target Deployment to
#   desired = clamp(max(forecast replicas, reactive replicas), minReplicas, maxReplicas)
# where the reactive part is the current request rate divided by capacityPerReplica, and the forecast part divides the
# forecasting service's (ml-api) peak for the next leadTimeMinutes by the same capacity. Scale-up is immediate;
# scale-down is stabilized. Without capacityPerReplica nothing is calculated and the replica count is held.
#
# Requirements in this version: the target's request rate must be visible as Istio's
# istio_requests_total{reporter="destination"} in a Prometheus-compatible store, and a model must have been trained
# for the workload (see the README). Without a model the operator runs reactive-only.
#
# Only one controller may own a Deployment's replica count. In Active mode the operator refuses to scale while an HPA,
# an unpaused KEDA ScaledObject or another Active PredictiveAutoscaler targets the same Deployment (a paused KEDA
# ScaledObject kept for a manual hand-over is fine; see docs/coexistence.md).
apiVersion: autoscaling.devkuban.com/v1alpha1
kind: PredictiveAutoscaler
metadata:
  name: web-frontend
  namespace: shop
spec:
  # Recommend (the default) computes and publishes the decision without scaling; set Active to scale.
  mode: Recommend
  targetDeployment:
    name: web-frontend
    namespace: shop          # must equal the CR's namespace
  minReplicas: 2
  maxReplicas: 20
  metrics:
    requests:
      enabled: true          # required: without it the operator cannot forecast and runs reactive-only
      capacityPerReplica: "200"  # requests per second one ready replica serves within its SLO (measure it; decimals allowed)
  prediction:
    enabled: true
    horizonMinutes: 60       # how far ahead the forecasting service predicts
    leadTimeMinutes: 20      # scale for the highest forecast within the next 20 minutes
    updateIntervalSeconds: 60
