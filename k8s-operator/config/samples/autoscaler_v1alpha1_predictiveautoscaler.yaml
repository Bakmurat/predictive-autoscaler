# A minimal PredictiveAutoscaler (fields this version of the operator actually reads).
#
# The operator scales the target Deployment to
#   desired = clamp(max(forecast replicas, reactive replicas), minReplicas, maxReplicas)
# where the reactive part is the current request rate divided by targetRPS, and the forecast part comes from the
# forecasting service (ml-api) for the next leadTimeMinutes. Scale-up is immediate; scale-down is stabilized.
#
# Requirements in this version: the target's request rate must be visible as Istio's
# istio_requests_total{reporter="destination"} in a Prometheus-compatible store, and a model must have been trained
# for the workload (see the README). Without a model the operator runs reactive-only.
#
# Only one controller may own a Deployment's replica count: do not also run an active HPA or KEDA ScaledObject on the
# same Deployment (a paused KEDA ScaledObject kept for a manual hand-over is fine; see docs/coexistence.md).
apiVersion: autoscaler.example.com/v1alpha1
kind: PredictiveAutoscaler
metadata:
  name: web-frontend
  namespace: shop
spec:
  targetDeployment:
    name: web-frontend
    namespace: shop          # this version allows any namespace; keep it equal to the CR's namespace
  minReplicas: 2
  maxReplicas: 20
  metrics:
    requests:
      enabled: true          # required: without it the operator cannot forecast and runs reactive-only
      targetRPS: 200         # requests per second one pod handles at the desired utilization
  prediction:
    enabled: true
    horizonMinutes: 60       # how far ahead the forecasting service predicts
    leadTimeMinutes: 20      # scale for the highest forecast within the next 20 minutes
    updateIntervalSeconds: 60
