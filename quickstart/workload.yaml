apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: pa-quickstart/ml-api:dev
          imagePullPolicy: Never
          command: [python3, /demo/app.py]
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: 8000}}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {memory: 128Mi}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: scripts, mountPath: /demo, readOnly: true}]
      volumes: [{name: scripts, configMap: {name: demo-scripts}}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: demo}
spec: {selector: {app: web}, ports: [{port: 8000}]}
---
apiVersion: v1
kind: Service
metadata: {name: web-metrics, namespace: demo}
spec: {clusterIP: None, selector: {app: web}, ports: [{port: 8000}]}
