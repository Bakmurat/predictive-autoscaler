# Both documented newcomer paths; read-only GitHub token, source-built images, disposable clusters only.
name: quickstart

on:
  pull_request:
    paths: ["charts/**", "k8s-operator/**", "ml-engine/**", "quickstart/**", "hack/smoke/synth.py", ".github/workflows/quickstart.yml"]
  push:
    branches: [main, "product/**"]
    paths: ["charts/**", "k8s-operator/**", "ml-engine/**", "quickstart/**", "hack/smoke/synth.py", ".github/workflows/quickstart.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    name: newcomer install (kind, Kubernetes 1.35)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.35.9
      KUBECTL_SHA256: 3cfeaf80be482b435b0aa214aff6e0b2c312ee23c0ff20810c75517b6004c6eb
      HELM_VERSION: v3.22.0
      HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: install kind, kubectl, helm (checksums verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  bin/kind" | sha256sum -c -
          curl -fsSLo bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  bin/kubectl" | sha256sum -c -
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm && mv linux-amd64/helm bin/
          chmod +x bin/kind bin/kubectl
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: build the images from this commit
        run: |
          docker build -q -t pa-quickstart/operator:ci k8s-operator
          docker build -q -t pa-quickstart/ml-api:ci ml-engine
      - name: fresh install, real request telemetry, activation and stop
        env:
          OPERATOR_IMAGE: pa-quickstart/operator:ci
          FORECASTER_IMAGE: pa-quickstart/ml-api:ci
          PA_QUICKSTART_STATE: ${{ runner.temp }}/pa-real
        run: |
          quickstart/kind.sh up
          quickstart/kind.sh active
          quickstart/kind.sh stop
          # Refuse existing state and a replaced node identity before any lifecycle mutation.
          if quickstart/kind.sh up; then echo "adopted existing state"; exit 1; fi
          cp -a "$PA_QUICKSTART_STATE" "${PA_QUICKSTART_STATE}-wrong"
          echo unrelated-node > "${PA_QUICKSTART_STATE}-wrong/node-id"
          if PA_QUICKSTART_STATE="${PA_QUICKSTART_STATE}-wrong" quickstart/kind.sh down; then
            echo "deleted with the wrong node identity"; exit 1
          fi
          echo '' > "${PA_QUICKSTART_STATE}-wrong/node-id"
          if PA_QUICKSTART_STATE="${PA_QUICKSTART_STATE}-wrong" quickstart/kind.sh down; then
            echo "deleted without a node identity"; exit 1
          fi
          quickstart/kind.sh status
          cp -a "$PA_QUICKSTART_STATE" "${PA_QUICKSTART_STATE}-offline"
          echo unavailable > "${PA_QUICKSTART_STATE}-offline/kubeconfig"
          PA_QUICKSTART_STATE="${PA_QUICKSTART_STATE}-offline" quickstart/kind.sh down
      - name: explicit synthetic history, training, fresh forecast and activation
        env:
          OPERATOR_IMAGE: pa-quickstart/operator:ci
          FORECASTER_IMAGE: pa-quickstart/ml-api:ci
          PA_QUICKSTART_STATE: ${{ runner.temp }}/pa-synthetic
        run: |
          quickstart/kind.sh up --synthetic-history
          quickstart/kind.sh active
          quickstart/kind.sh stop
          quickstart/kind.sh down
