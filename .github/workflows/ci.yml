# CI: the same checks as `make verify` (scripts/verify.sh), on GitHub-hosted runners only.
# Security (public repository): read-only token, no secrets, no deployment credentials, actions pinned to commit SHAs,
# never `pull_request_target` (pull-request code never runs with write permissions). Releases get their own workflow.
name: ci

on:
  pull_request:
  push:
    branches: [main, "product/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: operator (go vet, go test -race)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: "1.25.x"            # the operator image's builder (k8s-operator/Dockerfile)
          cache-dependency-path: k8s-operator/go.sum
      - name: verify (Go)
        run: LOG=/dev/null scripts/verify.sh --go-only

  envtest:
    name: operator write path (envtest, Kubernetes 1.35 API server)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: k8s-operator/go.sum
      - name: envtest
        run: make envtest

  python:
    name: forecaster + evaluation tooling (pytest, scorer, archive)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"            # the forecasting image's base (ml-engine/Dockerfile)
          cache: pip
          cache-dependency-path: |
            ml-engine/requirements.txt
            ml-engine/requirements-dev.txt
      - name: install
        run: python -m pip install -r ml-engine/requirements.txt -r ml-engine/requirements-dev.txt
      - name: verify (Python)
        run: LOG=/dev/null PYTHON=python scripts/verify.sh --python-only

  chart:
    name: chart (helm ${{ matrix.helm }} lint + template, kubeconform 1.33–1.35)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:                            # Helm 3 (Argo CD's) and Helm 4; tarball checksums pinned here
          - {helm: v3.22.0, sha256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb}
          - {helm: v4.3.0, sha256: 86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb}
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: install helm and kubeconform (checksums verified)
        env:
          HELM_VERSION: ${{ matrix.helm }}
          HELM_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -fsSLo helm.tgz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm && mv linux-amd64/helm bin/
          curl -fsSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform && mv kubeconform bin/
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: chart checks
        run: scripts/chart-check.sh
